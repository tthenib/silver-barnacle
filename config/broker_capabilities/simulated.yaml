# Reviewed capability allowlist for the simulated broker.
# The execution gateway exposes only the intersection of this allowlist and
# the capabilities the broker adapter reports at runtime. A capability the
# broker claims but this file does not list is refused.
broker_name: "simulated"
allowed_asset_classes: ["EQUITY"]
allowed_order_types: ["MARKET"]
allowed_sides: ["BUY", "SELL"]
